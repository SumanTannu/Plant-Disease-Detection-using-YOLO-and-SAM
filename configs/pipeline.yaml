seed: 42

paths:
  dataset_yaml: dataset/data.yaml
  source_images: dataset/train/images
  source_labels: dataset/train/labels
  artifacts_dir: artifacts
  runs_dir: runs

split:
  val_ratio: 0.1
  validate_images: true
  auto_fix_labels: true
  oversample_minority: true
  imbalance_target_ratio: 0.6
  imbalance_max_repeat: 4

detection:
  model: yolo12n.pt
  epochs: 10  
  imgsz: 416
  batch: 8
  device: "0"
  workers: 6
  amp: true
  auto_safe_mode: true
  cpu_fallback: false
  print_epoch_metrics: true
  auto_resume: true
  resume_checkpoint: ""
  degrees: 0.0 #rotation degrees for augmentation
  translate: 0.05 #translation for augmentation
  scale: 0.2 #scaling for augmentation
  shear: 0.0 #slant and stretch for augmentation
  perspective: 0.0 #grey corners for augmentation
  flipud: 0.1 #vertical flip for augmentation
  mixup: 0.0 #blend two images for augmentation
  cutmix: 0.0 #cut and paste for augmentation
  copy_paste: 0.1 #copy and paste for augmentation
  mosaic: 0.0 #combine 4 images into one for augmentation
  erasing: 0.0 #randomly erase part of the image for augmentation
  auto_augment: None
  close_mosaic: 0 #disables  mosaic augmentation 
  project: runs/detection
  name: yolo12_detector
  conf_threshold: 0.25
  iou_threshold: 0.45
  max_det: 100

sam:
  model_path: sam3.pt
  conf_threshold: 0.25
  min_mask_area: 64

pseudo_segmentation:
  prompt_source: gt
  copy_images: false
  save_debug_masks: false
  output_dir: artifacts/pseudo_segmentation_dataset

segmentation:
  model: yolo12n-seg.pt
  epochs: 30
  imgsz: 416
  batch: 8
  device: "0"
  workers: 6
  amp: true
  auto_safe_mode: true
  cpu_fallback: false
  print_epoch_metrics: true
  auto_resume: true
  resume_checkpoint: ""
  degrees: 5.0
  shear: 2.0
  perspective: 0.0005
  flipud: 0.1
  mixup: 0.1
  cutmix: 0.05
  copy_paste: 0.1
  project: runs/segmentation
  name: yolo12_segmentation
  conf_threshold: 0.25
  iou_threshold: 0.45

inference:
  conf_threshold: 0.25
  min_leaf_area: 100.0
  leaf_area_mode: bbox
  output_dir: artifacts/inference
